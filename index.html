<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS | Stark / Ultron Command Center</title>
<style>
:root{color-scheme:dark;--blue:#22c9ff;--red:#ff2746}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000714;color:#c6f4ff;font-family:Menlo,Monaco,monospace;overflow:hidden}#stage{position:absolute;inset:0;overflow:hidden;background:#000612}#art{position:absolute;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none}#scan{position:absolute;inset:0;pointer-events:none;opacity:.16;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(12,182,255,.15) 4px);animation:flicker 9s infinite}@keyframes flicker{96%{opacity:.16}97%{opacity:.06}100%{opacity:.16}}#clock{position:absolute;top:2.1%;left:42%;width:16%;height:10%;display:flex;justify-content:center;align-items:center;background:rgba(0,8,21,.88);border:1px solid rgba(41,197,252,.23);border-radius:12px;box-shadow:0 0 20px rgba(20,148,253,.22);font-size:clamp(16px,3.7vw,66px);font-weight:900;letter-spacing:.06em;color:#d4f6ff;text-shadow:0 0 14px #2fa9ff}#clock small{font-size:.27em;align-self:center;margin-left:4px}#date{position:absolute;top:11.1%;left:42%;width:16%;text-align:center;color:#8cdafa;font-size:clamp(6px,.8vw,14px);letter-spacing:.1em;background:rgba(0,6,18,.8)}.zone{position:absolute;top:1.2%;height:8px;pointer-events:none}.zone.left{left:0;width:49%;box-shadow:0 1px 24px 5px #009dff}.zone.right{right:0;width:49%;box-shadow:0 1px 24px 5px #ff174a}.hit{position:absolute;border:1px solid transparent;background:transparent;cursor:pointer;color:transparent;font-size:0;border-radius:10px}.hit:hover,.hit:focus-visible{outline:none;border-color:#55cfff;background:rgba(18,164,255,.15);box-shadow:0 0 17px rgba(34,192,255,.85)}.hit.red:hover{border-color:#ff345b;background:rgba(255,35,66,.15);box-shadow:0 0 15px #ff224e}.toast{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);padding:10px 16px;border:1px solid var(--blue);background:rgba(0,13,27,.95);color:#bdecff;box-shadow:0 0 20px #008fea;font-size:clamp(10px,1vw,15px);border-radius:6px;opacity:0;transition:opacity .2s;max-width:88%;text-align:center;pointer-events:none}.toast.show{opacity:1}#command{position:absolute;top:35%;left:25%;width:50%;padding:18px;border:1px solid var(--blue);box-shadow:0 0 45px #0076bc;background:rgba(0,8,22,.97);display:none;border-radius:8px}#command.visible{display:block}#command h2{font-size:clamp(15px,2vw,27px);margin:0 0 12px;color:#49cfff;letter-spacing:.25em}#command input{width:100%;font:inherit;font-size:clamp(13px,1.4vw,22px);padding:12px;color:#fff;background:#051626;border:1px solid #277baf;outline:none}#command p{font-size:11px;color:#a1bad2}#close{float:right;border:0;background:none;color:#fff;font-size:22px;cursor:pointer}#live{position:absolute;left:41%;bottom:18%;width:18%;text-align:center;color:#7ed6ff;font-size:clamp(7px,.7vw,13px);text-shadow:0 0 10px #00abf9;letter-spacing:.18em}#help{position:absolute;right:1%;bottom:1%;font-size:clamp(7px,.65vw,11px);color:#bce8ff;background:rgba(0,10,24,.8);padding:5px 8px;border:1px solid #236ba3} @media(max-width:700px){#help{display:none}#command{left:5%;width:90%;top:30%}}
</style></head><body><main id="stage"><img id="art" src="jarvis_background.png" alt="Iron Man blue left, glowing Jarvis core center, Ultron red right futuristic HUD"><div id="scan"></div><div class="zone left"></div><div class="zone right"></div><div id="clock"></div><div id="date"></div><div id="live">JARVIS • INTERFACE ONLINE</div>
<!-- Interactive hotspots over the action icons in the approved design -->
<button class="hit" style="left:27.1%;top:87%;width:4.7%;height:9%" data-act="listen" aria-label="Listen"></button>
<button class="hit" style="left:32.7%;top:87%;width:4.7%;height:9%" data-act="apps" aria-label="Open applications"></button>
<button class="hit" style="left:38.4%;top:87%;width:4.7%;height:9%" data-act="search" aria-label="Web search"></button>
<button class="hit" style="left:43.8%;top:87%;width:4.7%;height:9%" data-act="music" aria-label="Play music"></button>
<button class="hit" style="left:49.2%;top:87%;width:4.7%;height:9%" data-act="stocks" aria-label="Stock report"></button>
<button class="hit" style="left:54.8%;top:87%;width:4.7%;height:9%" data-act="mail" aria-label="Check email"></button>
<button class="hit" style="left:60.3%;top:87%;width:4.7%;height:9%" data-act="notes" aria-label="Take notes"></button>
<button class="hit red" style="left:65.7%;top:87%;width:5%;height:9%" data-act="shutdown" aria-label="Exit fullscreen"></button>
<!-- Side menu -->
<button class="hit" style="left:1.6%;top:44%;width:10%;height:4.1%" data-act="apps" aria-label="Apps"></button>
<button class="hit" style="left:1.6%;top:47.8%;width:10%;height:4.1%" data-act="search" aria-label="Search"></button>
<button class="hit" style="left:1.6%;top:60.8%;width:10%;height:4.1%" data-act="stocks" aria-label="Stocks"></button>
<button class="hit" style="left:1.6%;top:65.5%;width:10%;height:4.1%" data-act="mail" aria-label="Email"></button>
<div id="command"><button id="close" aria-label="Close">×</button><h2>JARVIS // COMMAND</h2><input id="prompt" placeholder="Type a command, then press Enter" autocomplete="off"><p>Try: open google · open youtube · search quantum computing · open gmail · time</p></div><div id="toast" class="toast" role="status"></div><div id="help">CLICK HUD CONTROLS • PRESS / TO TYPE • F FOR FULLSCREEN</div></main>
<script>
const clock=document.getElementById('clock'),date=document.getElementById('date'),toast=document.getElementById('toast'),cmd=document.getElementById('command'),input=document.getElementById('prompt'),live=document.getElementById('live');let toastTimer;
function tick(){const d=new Date();clock.innerHTML=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false})+'<small>'+d.toLocaleTimeString('en-US',{hour12:true}).split(' ')[1]+'</small>';date.textContent=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}).toUpperCase()}tick();setInterval(tick,1000);
function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),4300)}
function openSafe(url){window.open(url,'_blank','noopener,noreferrer')}
function showCommand(prefix=''){cmd.classList.add('visible');input.value=prefix;input.focus()}
function hideCommand(){cmd.classList.remove('visible')}
function execute(t){const q=t.toLowerCase().trim().replace(/^jarvis[, ]*/,'');hideCommand();if(!q)return;if(q.includes('time')){say('CURRENT TIME: '+new Date().toLocaleTimeString());return}if(q.startsWith('search ')){openSafe('https://www.google.com/search?q='+encodeURIComponent(q.slice(7)));say('OPENING WEB SEARCH');return}if(q.includes('gmail')||q.includes('email')){openSafe('https://mail.google.com');say('OPENING GMAIL — inbox contents are not connected');return}if(q.includes('stock')||q.includes('market')){openSafe('https://finance.yahoo.com');say('OPENING STOCK MARKET — displayed HUD numbers are illustrative');return}if(q.includes('music')||q.includes('youtube')){openSafe('https://www.youtube.com');say('OPENING YOUTUBE');return}if(q.includes('google')||q.includes('browser')){openSafe('https://www.google.com');say('OPENING GOOGLE');return}if(q.includes('whatsapp')){openSafe('https://web.whatsapp.com');say('OPENING WHATSAPP');return}say('This visual interface is not yet connected to the Python Jarvis brain. Try a web command.')}
function action(a){switch(a){case'listen':{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){say('Browser voice recognition is unavailable here. Press / to type a command.');return}try{const r=new SR();r.lang='en-US';r.interimResults=false;r.onstart=()=>{live.textContent='LISTENING • MICROPHONE ACTIVE';say('Listening… allow microphone access if requested')};r.onresult=e=>{const s=e.results[0][0].transcript;live.textContent='RECOGNIZED: '+s.toUpperCase();execute(s)};r.onerror=e=>{live.textContent='MICROPHONE INACTIVE';say('Microphone error: '+e.error+'. Use typed commands instead.')};r.onend=()=>{setTimeout(()=>live.textContent='JARVIS • INTERFACE ONLINE',2500)};r.start()}catch(e){say('Unable to start microphone: '+e.message)}return}case'apps':showCommand('open ');return;case'search':showCommand('search ');return;case'music':openSafe('https://www.youtube.com');say('OPENING YOUTUBE');return;case'stocks':openSafe('https://finance.yahoo.com');say('OPENING FINANCE — HUD figures are illustrative');return;case'mail':openSafe('https://mail.google.com');say('OPENING GMAIL — not connected to inbox data');return;case'notes':showCommand('');say('Type a command. Notes storage requires additional implementation.');return;case'shutdown':if(document.fullscreenElement)document.exitFullscreen();else say('JARVIS DASHBOARD ACTIVE — CLOSE THIS TAB TO EXIT');return}}
document.querySelectorAll('.hit').forEach(b=>b.onclick=()=>action(b.dataset.act));document.getElementById('close').onclick=hideCommand;input.onkeydown=e=>{if(e.key==='Enter')execute(input.value);if(e.key==='Escape')hideCommand()};document.addEventListener('keydown',e=>{if(e.target===input)return;if(e.key==='/'){e.preventDefault();showCommand()}if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}if(e.key==='Escape')hideCommand()});
</script></body></html>
